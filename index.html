<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Robber Rumble</title>

<script>
// Poki SDK：尽早初始化。init 失败（广告拦截等）也照常开始游戏。不在 Poki 上时返回 null。
window.__pkInit = (async () => {
  const S = window.PokiSDK;
  if (!S) return null;
  try { await S.init(); } catch (e) {}
  return S;
})();
</script>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1f2a;color:#fff;

  .sk{--c:#ff8a1c;width:94px;height:94px;border-radius:50%;border:3px solid #fff;background:#f4f4f4;

  .sk .fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--c)}
  .sk .fill::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.9)}
  .sk.ready .fill::after{display:none}
  .sk .nm{position:absolute;left:4px;right:4px;top:13px;text-align:center;font-size:15px;font-weight:900;letter-spacing:.5px;white-space:nowrap;
    text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}
  .sk .pips{position:absolute;left:0;right:0;top:35px;text-align:center;font-size:11px;letter-spacing:2px;color:#fff;text-shadow:0 1px 2px #000}
  .sk .cdn{position:absolute;left:0;right:0;top:33px;text-align:center;font-size:17px;line-height:20px;font-weight:900;color:#222;text-shadow:0 0 3px #fff}
  .sk .key{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);min-width:24px;height:24px;line-height:24px;padding:0 3px;
    border-radius:7px;background:#111;color:#fff;border:2px solid #fff;font-size:16px;font-weight:900}
  .sk .key.wide{font-size:13px;padding:0 6px}
  @media (max-width:760px){.sk{width:72px;height:72px}.sk .nm{top:8px;font-size:13px}.sk .pips,.sk .cdn{top:26px}.sk .key{bottom:4px;height:20px;line-height:20px;font-size:13px}#lvbadge{bottom:96px}.sk .key.wide{font-size:11px;padding:0 3px;min-width:30px}#mebox{bottom:94px}#skills{right:8px;gap:6px}}
  .sk.ready{box-shadow:0 0 0 3px var(--c),0 0 20px var(--c)}

  #cards{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:none;gap:10px;pointer-events:auto}

  #menu h1{margin-top:18px}

  #bInvite{margin-top:2px}
  /* 技能按钮：右下角大氮气，其余三个小一号围成弧形（左、左上、上） */

  .sk{position:absolute;width:76px;height:76px}
  .sk .nm{top:17%;font-size:13px}.sk .pips{top:44%;font-size:10px}.sk .cdn{top:37%}.sk .key{bottom:7%}
  #sk0{right:0;bottom:0;width:100px;height:100px}#sk0 .nm{font-size:16px}
  #sk1{right:121px;bottom:12px}#sk2{right:88px;bottom:88px}#sk3{right:12px;bottom:121px}
  #lvbadge{right:250px;bottom:14px}
  #passives{left:50%;right:auto;transform:translateX(-50%);bottom:96px;justify-content:center;flex-wrap:wrap;max-width:min(560px,60vw);white-space:nowrap}
  #passives span b{color:#ffd23f;font-weight:900}
  @media (pointer:coarse){.sk .key{display:none}}
  @media (max-height:600px){.panel{padding:14px 20px}.panel h1{font-size:24px}#menu h1{margin-top:14px}.panel td{padding:2px 4px}.panel table{font-size:14px;margin:4px 0 8px}.win{font-size:18px}.code{font-size:28px;margin:2px 0}#carPrev{height:110px}}
  #banner{max-width:max(300px,min(760px,calc(100vw - 440px)))}
  @media (min-width:761px) and (max-width:1180px){#mebox{left:14px;transform:none;text-align:left;min-width:0;max-width:calc(100vw - 470px)}}
  @media (min-width:761px) and (max-width:1420px){#cards{bottom:126px;left:calc(50% - 110px)}#cardtime{bottom:116px;left:calc(50% - 110px)}}
  @media (max-width:520px){#board{display:none}#teams{left:8px;transform:none;top:44px;font-size:14px;padding:2px 8px}#banner{top:132px;font-size:16px}
    .card{width:calc((100vw - 28px) / 3);padding:7px}.card .nm{font-size:13px}.card .ds{font-size:11px}#cards{gap:5px}#cardtime{width:80vw}}
  .card .tag{display:inline-block;white-space:nowrap;margin-bottom:3px}
  @media (max-width:760px){#banner{max-width:92vw}}
  /* 手机（竖屏窄、或横屏矮）：去掉排行榜和被动标签，钱塔文字放左下，等级圈缩小放右边，技能按钮用小号 */
  @media (max-width:760px),(max-height:500px){
    #board{display:none}
    #passives{bottom:146px;max-width:92vw;font-size:11px;gap:4px}#passives span{padding:2px 6px}

    #lvbadge{width:54px;height:54px;padding:4px;right:150px;bottom:10px}#lvbadge b{font-size:19px}#lvbadge small{font-size:8px}
    .sk{width:52px;height:52px;border-width:2px}.sk .nm{left:2px;right:2px;font-size:10px;letter-spacing:0}.sk .pips{font-size:8px;letter-spacing:1px}.sk .cdn{font-size:14px}

    #cards{top:calc(min(140px, 30vw, 30vh) + 26px);bottom:auto;gap:5px}#cardtime{top:calc(min(140px, 30vw, 30vh) + 18px);bottom:auto}
    body.offer #banner{top:auto;bottom:176px}
  }
  @media (pointer:coarse){.card .key{display:none}}
  .card,.sk{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #cards,#cardtime{z-index:30}
  /* 音乐开关：对局里在计时器左边，菜单里在左上角 */
  .bMusic{width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:16px;line-height:30px;padding:0;cursor:pointer;pointer-events:auto;font-family:inherit;text-align:center}
  .bMusic.off{opacity:.45;text-decoration:line-through}
  #bMusicHud{position:fixed;top:8px;right:calc(50% + 50px)}
  @media (max-height:500px){#bMusicHud{top:3px;width:24px;height:24px;line-height:24px;font-size:13px}}

  /* 右手摇杆（在屏幕右半边拖动）时整组技能镜像到左下角 */
  body.lefty #skills{right:auto;left:14px}
  body.lefty .sk{right:auto!important}
  body.lefty #sk0{left:0}body.lefty #sk1{left:121px}body.lefty #sk2{left:88px}body.lefty #sk3{left:12px}
  body.lefty #lvbadge{right:auto;left:250px}
  @media (min-width:761px) and (max-width:1180px){body.lefty #mebox{left:auto;right:14px;text-align:right}}
  @media (min-width:761px) and (max-width:1420px){body.lefty #cards,body.lefty #cardtime{left:calc(50% + 110px)}}
  @media (max-width:760px),(max-height:500px){

    body.lefty #sk1{left:79px}body.lefty #sk2{left:58px}body.lefty #sk3{left:7px}

  @media (max-height:500px){
    #timer{font-size:22px;top:3px}
    #teams{top:31px;font-size:14px;padding:2px 10px}
    #banner{top:58px;font-size:14px;padding:4px 10px;max-width:calc(100vw - 60vh - 60px)}
    .card{width:150px;padding:7px}.card .nm{font-size:14px;margin:4px 0 2px}.card .ds{font-size:11px;line-height:1.3}
    #cards{top:60px;bottom:auto}#cardtime{top:53px;bottom:auto}body.offer #banner{opacity:0!important}
    #carPrev,#menu .sub{display:none}
    .panel{max-height:96vh;padding:10px 18px}#menu h1{margin-top:2px;font-size:22px;text-align:left;padding:0 46% 0 40px;min-height:30px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel h1{font-size:22px}
    .panel input{padding:8px;margin-bottom:6px}.panel button{padding:8px;margin:3px 0}.carpick{margin-bottom:6px}
    #results,#lobby{display:flex;flex-direction:column}#resList,#lobbyList{order:10}

</style>
</head>
<body>

<canvas id="ov"></canvas>

  </div>

<script type="module">
// 包里有 three.module.min.js 就用包里的（Poki 不允许从外部 CDN 加载），没有就从 CDN 加载（本地测试用）
const THREE = await import('./three.module.min.js').catch(() => import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'));

// ================= SIM START（纯游戏逻辑，不碰画面）=================
const GAME_ID = '7c1e9a52-3b8d-4f61-a2c4-9d0e5b7f3a18';
const MATCH_TIME = 180, MAX_PLAYERS = 9;
const CAR_R = 1.8, CAR_SPEED = 21, TURN = 8, ACCEL = 48;
const CELL = 36, ROAD = 13, NB = 4, BLOCK = CELL - ROAD, SIZE = NB * CELL + ROAD;
const rc = i => i * CELL + ROAD / 2;
const TEAM = s => Math.floor(s / 3);
const TEAM_COLORS = ['#ff4d4d', '#3b9bff', '#2fd36a'], TEAM_LABEL = ['#ff8a8a', '#8cc4ff', '#8ef0a8'];
const COLORS = ['#ff5a5f', '#ff8f3f', '#ff6fb5', '#2bd9fe', '#4f7dff', '#a66cff', '#3ddc84', '#b6e23a', '#22c9a5'];
const BOT_NAMES = ['Rocky', 'Vex', 'Nova', 'Ziggy', 'Blaze', 'Moxie', 'Dash', 'Ruby', 'Jinx'];
const MID = NB / 2, BZ = Math.round(NB * 2 / 3);

  help: [
    '<b>In short</b>  Grab cash, stack it on your roof, level up, bank it at home.<br><b>Grab cash</b>  Coins float along the roads; where they cluster changes every match, and collected spots take about half a minute to come back. Coins pile up on your roof as a cash stack and also give you XP. There is one vault on the map (look for the golden beam): park on it to keep collecting until it runs dry, then it moves.<br><b>Bank it</b>  Drive back to your team\'s garage and hold still for 1 second to score. Red, Blue and Green have 3 cars each; after 3 minutes the team with the most banked cash wins. The taller your stack, the slower and wobblier you get, and sharp turns spill cash.<br><b>Ram</b>  Hit an enemy\'s side or rear with your front bumper to knock a big chunk of cash off their roof. Head-on, the higher level wins.<br><b>Level up</b>  Max level 10: pick a new skill at levels 2, 3 and 4, then upgrade a skill every level. Higher levels make your car bigger and meaner. Getting rammed before max level costs XP.<br><b>Controls</b>  (switches automatically to the set you use)<br>  Nitro is always SPACE (or left click).<br>  WASD set: WASD to drive, J / K / L = skills, pick cards with U / I / O<br>  Arrow set: arrow keys to drive, A / S / D = skills, pick cards with Q / W / E<br>  Also: right click = first skill, 1 / 2 / 3 pick cards. On mobile: joystick on the left half, buttons bottom right.',
    '<b>En bref</b>  Ramasse l\'argent, empile-le sur ton toit, monte de niveau, rapporte-le à la base.<br><b>Ramasser</b>  Des pièces flottent sur les routes ; leur répartition change à chaque partie, et une pièce ramassée met environ 30 secondes à revenir. Les pièces s\'empilent sur ton toit et te donnent aussi de l\'XP. Il y a un seul coffre-fort sur la carte (le rayon doré) : gare-toi dessus pour encaisser jusqu\'à ce qu\'il soit vide, puis il se déplace.<br><b>Encaisser</b>  Retourne au garage de ton équipe et reste immobile 1 seconde pour marquer. Rouge, Bleu et Vert ont 3 voitures chacun ; après 3 minutes, l\'équipe qui a encaissé le plus gagne. Plus ta pile est haute, plus tu es lent et instable, et les virages serrés font tomber de l\'argent.<br><b>Percuter</b>  Frappe le flanc ou l\'arrière d\'un ennemi avec ton pare-chocs avant pour faire tomber une grosse part de son argent. En face-à-face, le plus haut niveau gagne.<br><b>Niveaux</b>  Niveau max 10 : choisis une compétence aux niveaux 2, 3 et 4, puis améliore-en une à chaque niveau. Plus tu montes, plus ta voiture devient grosse et menaçante. Te faire percuter avant le niveau max te coûte de l\'XP.<br><b>Commandes</b>  (bascule automatiquement selon les touches utilisées)<br>  Nitro : toujours ESPACE (ou clic gauche).<br>  Mode WASD : WASD pour conduire, J / K / L = compétences, cartes avec U / I / O<br>  Mode flèches : flèches pour conduire, A / S / D = compétences, cartes avec Q / W / E<br>  Aussi : clic droit = 1re compétence, 1 / 2 / 3 pour les cartes. Sur mobile : joystick à gauche, boutons en bas à droite.',
    '<b>In breve</b>  Raccogli soldi, impilali sul tetto, sali di livello, portali alla base.<br><b>Raccogliere</b>  Le monete fluttuano lungo le strade; dove si concentrano cambia a ogni partita, e un punto raccolto torna dopo circa mezzo minuto. Le monete si impilano sul tetto e ti danno anche XP. Sulla mappa c\'è un solo caveau (cerca il raggio dorato): fermati sopra per incassare finché non si svuota, poi si sposta.<br><b>Depositare</b>  Torna al garage della tua squadra e resta fermo 1 secondo per segnare. Rossi, Blu e Verdi hanno 3 auto ciascuno; dopo 3 minuti vince la squadra che ha depositato di più. Più alta è la pila, più sei lento e traballante, e le curve strette fanno cadere soldi.<br><b>Speronare</b>  Colpisci il fianco o il retro di un nemico con il muso per fargli cadere un bel po\' di soldi. Muso contro muso vince il livello più alto.<br><b>Livelli</b>  Livello massimo 10: scegli una nuova abilità ai livelli 2, 3 e 4, poi potenziane una a ogni livello. Più sali, più la tua auto diventa grossa e minacciosa. Se vieni speronato prima del livello massimo perdi XP.<br><b>Comandi</b>  (cambiano da soli in base ai tasti che usi)<br>  Nitro: sempre SPAZIO (o clic sinistro).<br>  Schema WASD: WASD per guidare, J / K / L = abilità, carte con U / I / O<br>  Schema frecce: frecce per guidare, A / S / D = abilità, carte con Q / W / E<br>  Inoltre: clic destro = prima abilità, 1 / 2 / 3 per le carte. Su mobile: joystick a sinistra, pulsanti in basso a destra.',
    '<b>Kurz gesagt</b>  Geld einsammeln, aufs Dach stapeln, leveln, zu Hause einzahlen.<br><b>Sammeln</b>  Münzen schweben über den Straßen; wo es viele gibt, ändert sich jede Runde, und eingesammelte Stellen brauchen etwa eine halbe Minute, bis sie zurückkommen. Die Münzen stapeln sich als Geldturm auf deinem Dach und geben dir auch EP. Es gibt nur einen Tresor auf der Karte (achte auf den goldenen Lichtstrahl): Parke darauf, um zu kassieren, bis er leer ist – dann taucht er woanders auf.<br><b>Einzahlen</b>  Fahr zur Garage deines Teams und bleib 1 Sekunde stehen, um zu punkten. Rot, Blau und Grün haben je 3 Autos; nach 3 Minuten gewinnt das Team mit dem meisten eingezahlten Geld. Je höher dein Turm, desto langsamer und wackliger bist du, und scharfe Kurven werfen Geld ab.<br><b>Rammen</b>  Triff einen Gegner mit der Front an der Seite oder am Heck, um ihm einen großen Batzen Geld vom Dach zu hauen. Frontal gewinnt das höhere Level.<br><b>Leveln</b>  Max. Level 10: Auf Level 2, 3 und 4 wählst du je eine neue Fähigkeit, danach verbesserst du jedes Level eine. Je höher dein Level, desto größer und wilder dein Auto. Wirst du vor dem Max-Level gerammt, verlierst du EP.<br><b>Steuerung</b>  (wechselt automatisch je nach benutzten Tasten)<br>  Nitro ist immer LEERTASTE (oder Linksklick).<br>  WASD-Modus: WASD fahren, J / K / L = Fähigkeiten, Karten mit U / I / O<br>  Pfeil-Modus: Pfeiltasten fahren, A / S / D = Fähigkeiten, Karten mit Q / W / E<br>  Außerdem: Rechtsklick = erste Fähigkeit, 1 / 2 / 3 für Karten. Am Handy: Joystick links, Knöpfe unten rechts.',
    '<b>En resumen</b>  Recoge dinero, apílalo en el techo, sube de nivel y deposítalo en tu base.<br><b>Recoger</b>  Hay monedas flotando por las calles; dónde abundan cambia en cada partida, y un punto recogido tarda medio minuto en volver. Las monedas se apilan en tu techo y además te dan XP. Solo hay una bóveda en el mapa (busca el haz dorado): aparca encima para cobrar hasta vaciarla; luego aparece en otro lugar.<br><b>Depositar</b>  Vuelve al garaje de tu equipo y quédate quieto 1 segundo para puntuar. Rojo, Azul y Verde tienen 3 coches cada uno; tras 3 minutos gana el equipo que más haya depositado. Cuanto más alta la pila, más lento e inestable vas, y las curvas cerradas te hacen perder dinero.<br><b>Embestir</b>  Golpea el lateral o la parte trasera de un enemigo con tu frontal para tirarle un buen pellizco de dinero. De frente, gana el de mayor nivel.<br><b>Subir de nivel</b>  Nivel máximo 10: elige una habilidad nueva en los niveles 2, 3 y 4, y después mejora una en cada nivel. Cuanto más nivel, más grande e imponente es tu coche. Si te embisten antes del nivel máximo pierdes XP.<br><b>Controles</b>  (cambian solos según las teclas que uses)<br>  Nitro: siempre ESPACIO (o clic izquierdo).<br>  Modo WASD: WASD para conducir, J / K / L = habilidades, cartas con U / I / O<br>  Modo flechas: flechas para conducir, A / S / D = habilidades, cartas con Q / W / E<br>  Además: clic derecho = primera habilidad, 1 / 2 / 3 para las cartas. En móvil: joystick a la izquierda, botones abajo a la derecha.',
    '<b>Kısaca</b>  Para topla, tavana yığ, seviye atla, garaja götürüp yatır.<br><b>Toplama</b>  Yollarda altınlar süzülür; nerede çok olduğu her maçta değişir, toplanan yerler yaklaşık yarım dakikada geri gelir. Altınlar tavanında para kulesi olarak birikir ve sana XP de verir. Haritada tek bir kasa var (altın ışık sütununa bak): üstünde durarak boşalana kadar para al, sonra başka yere taşınır.<br><b>Yatırma</b>  Takımının garajına dön ve puan için 1 saniye bekle. Kırmızı, Mavi ve Yeşil takımın 3\'er arabası var; 3 dakika sonunda en çok para yatıran takım kazanır. Kule yükseldikçe yavaşlar ve sallanırsın; keskin dönüşler para düşürür.<br><b>Çarpma</b>  Düşmanın yanına ya da arkasına önden çarparak tavanındaki paranın büyük kısmını düşür. Kafa kafaya çarpışmada seviyesi yüksek olan kazanır.<br><b>Seviye</b>  En yüksek seviye 10: 2, 3 ve 4. seviyede yeni bir yetenek seç, sonra her seviyede birini geliştir. Seviye arttıkça araban büyür ve heybetlenir. Maksimum seviyeden önce çarpılırsan XP kaybedersin.<br><b>Kontroller</b>  (kullandığın tuşlara göre kendiliğinden değişir)<br>  Nitro her zaman BOŞLUK (veya sol tık).<br>  WASD düzeni: WASD sürüş, J / K / L = yetenekler, kart seçimi U / I / O<br>  Ok düzeni: ok tuşları sürüş, A / S / D = yetenekler, kart seçimi Q / W / E<br>  Ayrıca: sağ tık = ilk yetenek, kartlar için 1 / 2 / 3. Mobilde: sol yarıda joystick, sağ altta düğmeler.',
    '<b>一句话玩法</b>　吃钱、堆钱塔、升级、回家存钱。<br><b>吃钱</b>　路上飘着小金币，每局哪里多哪里少都不一样；被吃掉的地方会空上半分钟左右才长回来。吃到的钱堆在车顶成为钱塔，同时给你加经验。全图只有一座金库（看金色光柱），停在上面能一直拿钱，搬空后会换到别处。<br><b>存钱</b>　开回本队车库停 1 秒才算分。红、蓝、绿三队各 3 人，3 分钟后存款最多的队获胜。钱塔越高越慢、越晃，急转弯会掉钱。<br><b>撞人</b>　用车头撞到敌人侧面或车尾，能撞掉他车顶的一大块钱；车头对车头时等级高的赢。<br><b>升级</b>　最高 10 级：2、3、4 级各选一个技能，之后每级升级技能。等级越高车越大越威风，一眼就能看出谁强。满级前被撞会掉经验。<br><b>操作</b>（两套方案自动切换，按哪套就用哪套）<br>　氮气永远是空格（或鼠标左键）。<br>　WASD 方案：WASD 开车，J / K / L = 三个技能，选卡 U / I / O<br>　方向键方案：方向键开车，A / S / D = 三个技能，选卡 Q / W / E<br>　通用：鼠标右键 = 第一个技能，选卡也可按 1 / 2 / 3；手机左半屏摇杆，右下角按钮。',
    '<b>ひとことで</b>　お金を集めて屋根に積み、レベルを上げて、ガレージに持ち帰ろう。<br><b>集める</b>　道路にはコインが浮かんでいる。どこに多いかは毎回ちがい、取った場所は30秒ほどで復活する。コインは屋根にマネータワーとして積み上がり、経験値にもなる。マップには金庫がひとつだけ（金色の光の柱が目印）。上に止まると空になるまでお金がもらえ、空になると別の場所に移る。<br><b>預ける</b>　自分のチームのガレージにもどって1秒止まると得点。赤・青・緑の3チームが3台ずつ。3分後、預けた金額が一番多いチームの勝ち。タワーが高いほど遅く、ぐらぐらになり、急カーブでお金を落とす。<br><b>体当たり</b>　車の前で敵の横か後ろにぶつかると、屋根のお金をごっそり落とせる。正面衝突はレベルが高い方の勝ち。<br><b>レベルアップ</b>　最大レベル10。レベル2・3・4で新しいスキルをひとつずつ選び、その後はレベルごとにスキルを強化。レベルが上がるほど車が大きく強そうになる。最大レベル前にぶつけられると経験値が減る。<br><b>操作</b>（使ったキーに合わせて自動で切り替え）<br>　ニトロはいつでもスペース（または左クリック）。<br>　WASD：WASDで運転、J / K / L = スキル、カードは U / I / O<br>　矢印キー：矢印キーで運転、A / S / D = スキル、カードは Q / W / E<br>　共通：右クリック = 1つ目のスキル、カードは 1 / 2 / 3 でも選べる。スマホは画面左半分でスティック、右下にボタン。',
    '<b>한 줄 요약</b>  돈을 모아 지붕에 쌓고, 레벨업하고, 우리 팀 차고에 입금하자.<br><b>돈 모으기</b>  도로 위에 동전이 떠 있다. 어디에 많은지는 판마다 다르고, 먹은 자리는 30초쯤 지나야 다시 생긴다. 동전은 지붕에 돈탑으로 쌓이고 경험치도 준다. 맵에는 금고가 하나뿐이다(금색 빛기둥을 찾자). 위에 서 있으면 빌 때까지 돈을 받고, 비면 다른 곳으로 옮겨진다.<br><b>입금</b>  우리 팀 차고로 돌아가 1초 동안 멈춰 있어야 점수가 된다. 빨강·파랑·초록 팀이 3대씩. 3분 뒤 입금액이 가장 많은 팀이 이긴다. 돈탑이 높을수록 느려지고 흔들리며, 급커브에서 돈을 흘린다.<br><b>들이받기</b>  차 앞부분으로 적의 옆이나 뒤를 들이받으면 지붕의 돈을 왕창 떨어뜨린다. 정면충돌은 레벨이 높은 쪽이 이긴다.<br><b>레벨업</b>  최대 10레벨. 2·3·4레벨에 새 스킬을 하나씩 고르고, 이후에는 레벨마다 스킬을 강화한다. 레벨이 높을수록 차가 커지고 위풍당당해진다. 최대 레벨 전에 들이받히면 경험치를 잃는다.<br><b>조작</b>  (누르는 키에 따라 자동 전환)<br>  니트로는 언제나 스페이스(또는 왼쪽 클릭).<br>  WASD: WASD 운전, J / K / L = 스킬, 카드 선택 U / I / O<br>  방향키: 방향키 운전, A / S / D = 스킬, 카드 선택 Q / W / E<br>  공통: 오른쪽 클릭 = 첫 번째 스킬, 카드는 1 / 2 / 3으로도 선택. 모바일은 왼쪽 절반 조이스틱, 오른쪽 아래 버튼.',
    '<b>Resumo</b>  Pegue grana, empilhe no teto, suba de nível e deposite na base.<br><b>Pegar</b>  Moedas flutuam pelas ruas; onde há mais muda a cada partida, e um ponto coletado leva cerca de meio minuto para voltar. As moedas se empilham no teto e também dão XP. Há um único cofre no mapa (procure o feixe dourado): pare em cima para coletar até esvaziar; depois ele muda de lugar.<br><b>Depositar</b>  Volte à garagem do seu time e fique parado 1 segundo para pontuar. Vermelho, Azul e Verde têm 3 carros cada; após 3 minutos vence o time que mais depositou. Quanto mais alta a pilha, mais lento e instável você fica, e curvas fechadas derrubam grana.<br><b>Bater</b>  Acerte a lateral ou a traseira de um inimigo com a frente do carro para derrubar um bom tanto da grana dele. De frente, vence o nível mais alto.<br><b>Subir de nível</b>  Nível máximo 10: escolha uma habilidade nova nos níveis 2, 3 e 4, depois melhore uma a cada nível. Quanto maior o nível, maior e mais imponente o carro. Levar batida antes do nível máximo tira XP.<br><b>Controles</b>  (trocam sozinhos conforme as teclas que você usa)<br>  Nitro é sempre ESPAÇO (ou clique esquerdo).<br>  Modo WASD: WASD para dirigir, J / K / L = habilidades, cartas com U / I / O<br>  Modo setas: setas para dirigir, A / S / D = habilidades, cartas com Q / W / E<br>  Também: clique direito = primeira habilidade, 1 / 2 / 3 escolhem cartas. No celular: joystick na metade esquerda, botões no canto inferior direito.',
    '<b>Коротко</b>  Собирай деньги, копи их на крыше, качайся и сдавай в свой гараж.<br><b>Сбор</b>  Над дорогами парят монеты; где их больше, меняется каждый матч, а на месте собранной монеты новая появляется примерно через полминуты. Монеты складываются на крыше в денежную башню и дают опыт. На карте один сейф (ищи золотой луч): стой на нём и получай деньги, пока он не опустеет, — потом он переедет.<br><b>Сдача</b>  Вернись в гараж своей команды и постой 1 секунду, чтобы заработать очки. У Красных, Синих и Зелёных по 3 машины; через 3 минуты побеждает команда, сдавшая больше всех. Чем выше башня, тем ты медленнее и сильнее шатаешься, а на резких поворотах деньги падают.<br><b>Таран</b>  Врежься передом в бок или зад врага, чтобы сбить с его крыши большой куш. В лобовом столкновении побеждает тот, у кого уровень выше.<br><b>Уровни</b>  Максимум 10: на 2, 3 и 4 уровне выбери новый навык, дальше каждый уровень улучшай один из них. Чем выше уровень, тем больше и грознее машина. Если тебя протаранят до максимального уровня, потеряешь опыт.<br><b>Управление</b>  (переключается само по нажатым клавишам)<br>  Нитро — всегда ПРОБЕЛ (или левая кнопка мыши).<br>  Схема WASD: WASD — езда, J / K / L — навыки, карты — U / I / O<br>  Схема стрелок: стрелки — езда, A / S / D — навыки, карты — Q / W / E<br>  Также: правая кнопка мыши — первый навык, карты можно выбрать 1 / 2 / 3. На телефоне: джойстик в левой половине, кнопки справа внизу.',

  return { x, z };
}
function pressSlot(i) { const me = G.cars[G.mySlot]; if (!me) return; const k = activeList(me)[i]; if (k) pressSkill(k); }
function pressSkill(k) {
  const me = G.cars[G.mySlot];
  if (!me || G.phase !== 'play' || !me.skills[k]) return;
  if (G.isHost) { useSkill(me, k); return; }
  if ((G.localCd[k] || 0) > 0) return;
  const lv = me.skills[k];
  if (k === 'nitro') { G.localBoost = lvv(SKILLS.nitro.dur, lv); floatText(tl('nitroF'), me.x, me.z, '#ffb02e'); SFX.nitro(); }
  G.localCd[k] = cdOf(me, k, lv);
  sendTo(G.hostId, { t: 'A', k });
}
for (let i = 0; i < 4; i++) $('sk' + i).addEventListener('pointerdown', e => { e.stopPropagation(); pressSlot(i); });

let myCar = 0;
try { myCar = clamp(+(localStorage.getItem('heist_car') || 0), 0, 4) || 0; } catch (e) {}
function myModel() { return myCar; }
function drawCarPick() {
  $('carPick').innerHTML = CAR_MODELS.map((m, i) => `<button data-i="${i}" class="${i === myCar ? 'on' : ''}">${m.name}<small>${m.desc}</small></button>`).join('');
  $('carPick').querySelectorAll('button').forEach(b => b.onclick = () => { myCar = +b.dataset.i; try { localStorage.setItem('heist_car', myCar); } catch (e) {} drawCarPick(); });
}
// 菜单里的 3D 预览：选中的车在转台上转，并依次展示 5 档进化外观
const pv = { r: null };
function drawPreview(t) {
  const cv = $('carPrev');
  if (!pv.r) {
    try {
      pv.r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
      pv.r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      pv.sc = new THREE.Scene();
      pv.sc.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.1));
      const l = new THREE.DirectionalLight(0xffffff, 1.1); l.position.set(5, 10, 6); pv.sc.add(l);
      pv.cam = new THREE.PerspectiveCamera(28, 2.5, 0.1, 100);
      const fl = new THREE.Mesh(new THREE.CircleGeometry(4.6, 40), new THREE.MeshLambertMaterial({ color: '#4a5266' }));
      fl.rotation.x = -Math.PI / 2; pv.sc.add(fl);
      pv.model = -1;
    } catch (e) { pv.r = null; return; }
  }
  const w = cv.clientWidth, h = cv.clientHeight;
  if (w && (pv.w !== w || pv.h !== h)) { pv.w = w; pv.h = h; pv.r.setSize(w, h, false); pv.cam.aspect = w / h; pv.cam.updateProjectionMatrix(); }
  if (pv.model !== myCar) { if (pv.car) pv.sc.remove(pv.car.group); pv.car = CARF.build(myCar, COLORS[0], TEAM_COLORS[0]); pv.sc.add(pv.car.group); pv.model = myCar; }
  const lk = Math.floor(t / 1.8) % 5;
  pv.car.setLook(lk);
  pv.car.group.rotation.y = t * 0.7;
  for (const wh of pv.car.wheels) wh.spin.rotation.z = -t * 4;
  pv.cam.position.set(0, 4.6, 12.5); pv.cam.lookAt(0, 0.8, 0);
  const nm = CAR_MODELS[myCar].name + ' · ' + lookName(lk);
  if ($('carName').textContent !== nm) $('carName').textContent = nm;
  pv.r.render(pv.sc, pv.cam);
}
let cgName = null;
function myName() { return (cgName || ($('name').value || '').trim()).slice(0, 12) || tl('robberN', { n: Math.floor(Math.random() * 90 + 10) }); }
try { $('name').value = localStorage.getItem('heist_name') || ''; } catch (e) {}
function saveName() { try { localStorage.setItem('heist_name', $('name').value); } catch (e) {} }
function setHand(h) {
  document.body.classList.toggle('lefty', h === 'right');
  try { localStorage.setItem('heist_hand', h); } catch (e) {}
}
try { if (localStorage.getItem('heist_hand') === 'right') document.body.classList.add('lefty'); } catch (e) {}
function reloadWith(extra) {
  const u = new URL(location.href);
  ['room', 'left'].forEach(k => u.searchParams.delete(k));
  for (const k in extra) u.searchParams.set(k, extra[k]);
  location.href = u.href;
}
// 当前房间报给平台：在房间里、还没满 9 个真人时可以加入
function reportRoom() {
  if (!G.online || !G.roomCode) return;
  let humans = 0;
  for (let s = 0; s < MAX_PLAYERS; s++) {
    if (G.isHost) { const r = G.roster[s]; if (r && !r.bot) humans++; }
    else if (G.bots ? !G.bots[s] : false) humans++;
  }
  CG.room(G.roomCode, humans < MAX_PLAYERS);
}
// 把界面上的固定文字换成当前语言
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = tl('title') === 'ROBBER RUMBLE' ? 'Robber Rumble' : tl('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tl(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = tl(el.dataset.tp); });
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = tl(el.dataset.th); });
  const sel = $('langSel');
  if (!sel.options.length) sel.innerHTML = CODES.map((c, i) => `<option value="${c}">${LANG_NAMES[i]}</option>`).join('');
  sel.value = LANG;
  drawCarPick();
  if (G.phase === 'lobby') showLobby();
  for (let i = 0; i < 4; i++) { $('sk' + i).dataset.k = ''; $('sk' + i).querySelector('.key').textContent = ''; }
}
function setLang(code) {
  if (!CODES.includes(code)) return;
  LANG = code;
  try { localStorage.setItem('heist_lang', code); } catch (e) {}
  applyLang();
}
$('langSel').onchange = e => setLang(e.target.value);
document.querySelectorAll('.bMusic').forEach(b => { b.onclick = e => { e.stopPropagation(); MUSIC.toggle(); b.blur(); }; });
MUSIC.paint();
function setStatus(t) { $('status').textContent = t; }
function busy(on) { ['bSolo', 'bQuick', 'bCreate', 'bJoin'].forEach(id => $(id).disabled = on); }
async function guard(fn) {
  saveName(); busy(true);
  try { await fn(); } catch (e) { console.error(e); setStatus(tl('error', { e: e.message || e })); busy(false); }
}
$('bSolo').onclick = () => {
  saveName();
  G.isHost = true; G.online = false; G.mySlot = 0; G.autoRestart = false;
  G.roster = [{ name: myName(), peer: null, bot: false, model: myModel() }];
  startMatch();
};
$('bQuick').onclick = () => guard(async () => { setStatus(tl('connecting')); await quickMatch(); });
$('bCreate').onclick = () => guard(async () => { setStatus(tl('creating')); await hostRoom(false, false); });
$('bJoin').onclick = () => guard(async () => {
  const code = $('code').value.trim();
  if (!code) { setStatus(tl('needCode')); busy(false); return; }
  setStatus(tl('joining')); await joinRoom(code);
});
function showLobby() {
  ['menu', 'results', 'hud'].forEach(id => $(id).classList.add('hidden'));
  $('lobby').classList.remove('hidden');
  $('lobbyCode').textContent = G.roomCode || '----';
  $('bStart').style.display = G.isHost ? 'block' : 'none';
  $('lobbyStatus').textContent = G.isHost ? tl('lobbyHost') : tl('lobbyWait');
  updateLobbyUI();
}
function updateLobbyUI() {
  if (G.phase !== 'lobby') return;
  const rows = [];
  for (let s = 0; s < MAX_PLAYERS; s++) {
    if (s % 3 === 0) rows.push(`<tr><td style="color:${TEAM_COLORS[TEAM(s)]};font-weight:800">${teamName(TEAM(s))}</td></tr>`);
    let nm = '';
    if (G.isHost) { const r = G.roster[s]; nm = r && !r.bot ? r.name : ''; }
    else if (G.names && G.bots && !G.bots[s]) nm = G.names[s];
    rows.push(`<tr><td><span style="color:${COLORS[s]}">●</span> ${nm ? esc(nm) : '<span style="color:#667">' + tl('emptySlot') + '</span>'}${s === G.mySlot ? tl('you') : ''}</td></tr>`);
  }
  $('lobbyList').innerHTML = rows.join('');
}
$('bStart').onclick = () => { if (G.isHost) startMatch(); };
function showResults(res, ts) {
  $('hud').classList.add('hidden'); hideOffer();
  $('results').classList.remove('hidden');
  ts = ts || [0, 0, 0];
  const myT = TEAM(G.mySlot), mx = Math.max(...ts), winners = [0, 1, 2].filter(t => ts[t] === mx);
  const win = winners.length > 1 ? tl('tie', { teams: winners.map(t => teamName(t)).join(tl('tieSep')) }) : tl('win', { team: teamName(winners[0]) }) + (winners[0] === myT ? tl('youWin') : tl('youLose'));
  CG.setPlaying(false);
  if (winners.length === 1 && winners[0] === myT) CG.happy();
  MUSIC.jingle(winners.length > 1 ? 0 : winners[0] === myT ? 1 : -1);
  $('winTxt').innerHTML = [0, 1, 2].map(t => `<span style="color:${TEAM_LABEL[t]}">${teamName(t)} ${ts[t]}</span>`).join('　') + `<br>${win}`;
  $('resList').innerHTML = res.map((r, i) =>
    `<tr><td>${i + 1}　<span style="color:${TEAM_COLORS[TEAM(r.slot)]}">●</span> Lv${r.lvl} ${esc(r.name)}${r.bot ? tl('cpu') : ''}${r.slot === G.mySlot ? tl('you') : ''}</td><td class="r">$${r.score}</td></tr>`).join('');
  $('bAgain').style.display = G.isHost ? 'block' : 'none';
  $('resStatus').textContent = G.isHost ? (G.online ? tl('autoNext', { n: 10 }) : '') : tl('waitNext');
  G.phase = 'end';
  // 一局结束是天然的休息点：联机时结果页一出来就放插屏（房主等广告结束才开下一局）；单人在点“再来一局”时放
  if (G.online) CG.midgame();
}
$('bAgain').onclick = () => { if (!G.isHost) return; if (G.online) startMatch(); else CG.midgame(() => { if (G.phase === 'end') startMatch(); }); };
$('bLeave1').onclick = $('bLeave2').onclick = () => { CG.leftRoom(); reloadWith({}); };
{
  if (new URLSearchParams(location.search).get('left')) setStatus(tl('hostLeft'));
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const h = viewH() / 2, w = h * innerWidth / innerHeight;
  cam.left = -w; cam.right = w; cam.top = h; cam.bottom = -h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now(), acc = 0, cacc = 0, firstFrame = true;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.phase === 'play') {
    const inp = getInput();
    if (G.isHost) {
      acc += dt;
      while (acc >= 1 / 60) { hostStep(1 / 60, inp); acc -= 1 / 60; if (G.phase !== 'play') break; }
      if (G.online) { G.snapT -= dt; if (G.snapT <= 0) { G.snapT = 1 / 15; sendSnapshot(); } }
    } else { cacc += dt; while (cacc >= 1 / 60) { clientStep(1 / 60, inp); cacc -= 1 / 60; } }
  } else if (G.phase === 'end' && G.isHost && G.online) {
    G.restartT -= dt;
    { const rt = tl('autoNext', { n: Math.ceil(Math.max(0, G.restartT)) }); if ($('resStatus').textContent !== rt) $('resStatus').textContent = rt; }
    if (G.restartT <= 0 && !CG.adBusy) startMatch();
  }
  if (G.cars.length) { render(dt); updateHUD(dt); }
  else { cam.position.set(SIZE / 2, CAM_DIST * Math.sin(CAM_PITCH), SIZE / 2 + CAM_DIST * Math.cos(CAM_PITCH)); cam.lookAt(SIZE / 2, 0, SIZE / 2); renderer.render(scene, cam); }
  ovDt = dt; ovK = dt * 60;
  drawOverlay();
  CG.setPlaying(G.phase === 'play' && !CG.adBusy);
  MUSIC.update(G.phase === 'play' && !CG.adBusy);
  if (firstFrame) { firstFrame = false; CG.loadingDone(); }
  if (!$('menu').classList.contains('hidden')) drawPreview(now / 1000);
  requestAnimationFrame(frame);
}
applyLang();
requestAnimationFrame(frame);
(async () => {
  await CG.init();
  if (CG.on) {
    // 在平台上：玩家自己选过 > 平台 locale > 英语
    if (!savedLang) { const lc = langFromCode(CG.locale()); if (lc) { LANG = lc; applyLang(); } }
    const applyName = n => { if (!n) return; cgName = n; $('name').value = n; $('name').readOnly = true; };
    applyName(await CG.userName());
    CG.onAuth(applyName);
    CG.onJoinRoom(code => { if (G.phase === 'menu' || !G.phase) joinFromInvite(code); else { CG.leftRoom(); reloadWith({ room: code }); } });
  }
  const urlRoom = new URLSearchParams(location.search).get('room');
  const room = urlRoom || CG.inviteRoom();
  if (room) joinFromInvite(room);
  else if (CG.instantMultiplayer()) guard(async () => { setStatus(tl('creating')); await hostRoom(false, false); });
})();
function joinFromInvite(code) {
  $('code').value = code;
  guard(async () => { setStatus(tl('inviteJoin')); await joinRoom(code); });
}
$('bInvite').onclick = async () => {
  if (!G.roomCode) return;
  const link = CG.inviteLink(G.roomCode);
  let ok = false;
  try { await navigator.clipboard.writeText(link); ok = true; } catch (e) {}
  $('lobbyStatus').textContent = ok ? tl('copied') : link;
};
if (location.search.includes('debug')) { window.__G = G; window.__CG = CG; window.__setLang = setLang; window.__showOffer = showOffer; window.__banner = banner; window.__tl = tl; window.__MUSIC = MUSIC; }
</script>
